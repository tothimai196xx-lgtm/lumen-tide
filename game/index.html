<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Tide — a glowing reef arcade</title>
<meta name="description" content="Lumen Tide: swim a glowing reef, catch the attuned colour to build your combo, dodge the spiked urchins, and tame the tide at level 10.">
<style>
  html, body { margin: 0; padding: 0; background: #050914; min-height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eaf6ff; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #0b1030; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; }
  footer { padding: 10px 16px 18px; font-size: 14px; color: #9fc3d8; text-align: center; }
  footer b { color: #eaf6ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" role="img"
    aria-label="Lumen Tide game: a glowing wisp catching light motes and dodging urchins"></canvas>
  <p id="status" aria-live="polite"></p>
  <footer><b>Lumen Tide</b> — catch the attuned colour, build the combo, dodge the urchins.
    Move: mouse or WASD / arrows &nbsp;·&nbsp; Dash: Space &nbsp;·&nbsp; Pause: P &nbsp;·&nbsp; Mute: M</footer>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
